[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "halloween-shop"
version = "1.0.0"
description = "Boutique Halloween : API EC2 et traitements événementiels Lambda"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6",
  "psycopg[binary]==3.3.6", "PyJWT[crypto]==2.15.1", "boto3==1.43.120",
  "alembic==1.20.1", "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["postgres: integration tests requiring TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
