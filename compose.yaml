services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: halloween
      POSTGRES_USER: halloween
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halloween -d halloween"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["python", "-m", "shop.cli", "init"]
    environment: &app_environment
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://halloween:local-only-password@db:5432/halloween
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *app_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    command: ["python", "-m", "shop.publisher"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
